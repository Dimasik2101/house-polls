<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опросы дома</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121214;
            --card-bg: #1A1A1C;
            --card-border: #2A2A32;
            --text: #FFFFFF;
            --hint: #9F9F9F;
            --accent: #CCFF00;
            --btn-text: #121214;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        h2 { font-size: 20px; margin-bottom: 16px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .btn {
            background: var(--accent);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>Активные опросы</h2>
    <div class="card">
        <p>Загрузка опросов...</p>
    </div>
</body>
</html>
